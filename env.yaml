name: KIRC_env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ── Python ──────────────────────────────────────────────────────────────────
  - python=3.11

  # Core scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - networkx
  - scikit-learn
  - statsmodels

  # Jupyter
  - jupyterlab
  - ipykernel
  - nbformat

  # R ↔ Python bridge
  - rpy2

  # Pip-only packages
  - pip
  - pip:
    - pyreadr          # read .RData / .rds files in Python
    - mygene           # gene ID mapping
    - matplotlib-venn
    - gseapy           # gene-set enrichment
    - inmoose          # pyCombat batch correction
    - tensorflow==2.16.*  # transfer-learning lab (includes keras)

  # ── R ───────────────────────────────────────────────────────────────────────
  # r-base=4.5: bioconda builds all required Bioconductor packages for R 4.5.
  # r-base=4.2 was used previously but its bioconda packages link against
  # libicui18n.so.58 which is absent from the modern conda-forge icu stack,
  # causing post-link failures.  R 4.5 packages link against the current icu.
  - zlib                # required for source compilation of R packages (VariantAnnotation, affyio, etc.)
  - xz                  # provides liblzma dev files (required by Rhtslib/VariantAnnotation)
  - r-base=4.5.2

  # CRAN packages
  - r-devtools
  - r-dplyr
  - r-ggplot2
  - r-ggrepel
  - r-ggdendro
  - r-igraph
  - r-glmnet
  - r-wgcna
  - r-dynamictreecut
  - r-flashclust
  - r-foreach
  - r-doparallel
  - r-rcpp
  - r-reticulate
  - r-rsqlite
  - r-openxlsx
  - r-plyr
  - r-stringr
  - r-bnstruct         # KNN imputation (bnstruct::knn.impute) — epigenetics lab
  - r-irkernel        # run R kernels in JupyterLab

  # Bioconductor packages (via bioconda — all have r45 builds)
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-preprocesscore
  - bioconductor-annotationdbi
  - bioconductor-deseq2
  - bioconductor-minfi
  - bioconductor-epidish
  - bioconductor-org.hs.eg.db
  - bioconductor-clusterprofiler
  - bioconductor-stringdb
  - bioconductor-moda
  - bioconductor-sva